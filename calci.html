<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calci.css">
</head>
<body>
    <div class="outerbody">
      <div class="screen"></div>
      <div class="calbody">
        <div class="1 btns">1</div>
        <div class="2 btns">2</div>
        <div class="3 btns">3</div>
        <div class="add btns">+</div>
        <div class="4 btns">4</div>
        <div class="5 btns">5</div>
        <div class="6 btns">6</div>
        <div class="minus btns">-</div>
        <div class="7 btns">7</div>
        <div class="8 btns">8</div>
        <div class="9 btns">9</div>
        <div class="multiply btns">*</div>
        <div class="0 btns">0</div>
        <div class="dot btns">.</div>
        <button class="equals btns" id="equalto">=</button>
        <div class="divide btns">/</div>
     </div>
        <div class="bbtns">
          <div class="clear btns" id="AC">AC</div>
          <div class="dl btns">Del</div>
        </div>
  </div>
</body>
<script src="calci.js"></script>
</html>
